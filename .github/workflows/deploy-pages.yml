name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: Siteyi derle
        run: npm run build
      - name: GitHub Pages paketi oluştur
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
