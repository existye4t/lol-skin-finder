name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Derlenecek Git ref / branch / commit (boşsa tetikleyen commit kullanılır)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || '' }}
      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları yükle
        run: npm ci
      - name: Paylaşım görselleri önbelleği
        uses: actions/cache@v5
        with:
          path: work/share-art
          key: share-art-${{ runner.os }}-${{ hashFiles('scripts/generate-share-art.mjs', 'scripts/skin-share-pages.mjs', 'src/skin-share.js', 'scripts/fonts/Inter.ttf', 'favicon.png') }}-${{ hashFiles('public/data/skins.json', 'public/data/rainbow.json', 'public/data/classic.json') }}
          restore-keys: share-art-${{ runner.os }}-${{ hashFiles('scripts/generate-share-art.mjs', 'scripts/skin-share-pages.mjs', 'src/skin-share.js', 'scripts/fonts/Inter.ttf', 'favicon.png') }}-
      - name: Markalı paylaşım görsellerini üret
        run: npm run generate-share-art
      - name: Siteyi derle
        run: npm run build
      - name: Pages paket boyutunu doğrula
        run: |
          bytes=$(du -sb dist | cut -f 1)
          echo "Pages output: $bytes bytes"
          test "$bytes" -lt 1000000000
      - name: GitHub Pages paketi oluştur
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v5
