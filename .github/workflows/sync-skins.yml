name: Sync League Skins

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-skin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. WEBSITE REPOSITORY
      # ==========================================

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================
      # 2. LEAGUESKINS REPOSITORY
      # ==========================================

      - name: Checkout LeagueSkins repository
        uses: actions/checkout@v6
        with:
          repository: Alban1911/LeagueSkins
          path: source-skins
          fetch-depth: 1

      # ==========================================
      # 3. PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ==========================================
      # 4. PREPARE DIRECTORIES
      # ==========================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p fantome
          mkdir -p data

          echo "Directories ready."

      # ==========================================
      # 5. SYNC FANTOME FILES
      # ==========================================

      - name: Sync Fantome files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING FANTOME FILES"
          echo "=========================================="

          rm -rf fantome
          mkdir -p fantome

          count=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"

            cp -f "$file" "fantome/$filename"

            count=$((count + 1))
          done < <(
            find source-skins/skins \
              -type f \
              -iname "*.fantome" \
              -print0
          )

          echo ""
          echo "Fantome files copied: $count"

      # ==========================================
      # 6. DOWNLOAD RIOT DATA DRAGON VERSION
      # ==========================================

      - name: Download latest Riot Data Dragon version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RIOT DATA"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/versions.json \
            https://ddragon.leagueoflegends.com/api/versions.json

          VERSION=$(python3 - <<'PY'
          import json

          with open("/tmp/versions.json", "r", encoding="utf-8") as f:
              versions = json.load(f)

          print(versions[0])
          PY
          )

          echo "Riot Data Dragon version: $VERSION"

          echo "$VERSION" > /tmp/riot-version.txt

      # ==========================================
      # 7. DOWNLOAD ALL CHAMPION METADATA
      # ==========================================

      - name: Download champion metadata
        shell: bash
        run: |
          set -e

          VERSION="$(cat /tmp/riot-version.txt)"

          mkdir -p /tmp/champions

          echo "Downloading champion list..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/champion.json \
            "https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/en_US/champion.json"

          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          version = Path("/tmp/riot-version.txt").read_text(
              encoding="utf-8"
          ).strip()

          with open("/tmp/champion.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          champions = data.get("data", {})

          print(f"Champions found: {len(champions)}")

          for champion_id in champions:
              url = (
                  f"https://ddragon.leagueoflegends.com/"
                  f"cdn/{version}/data/en_US/champion/"
                  f"{champion_id}.json"
              )

              output = Path("/tmp/champions") / f"{champion_id}.json"

              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--retry",
                      "5",
                      "--retry-delay",
                      "2",
                      "-sS",
                      "-o",
                      str(output),
                      url
                  ],
                  check=True
              )

          print("All champion metadata downloaded.")
          PY

      # ==========================================
      # 8. BUILD COMPLETE RIOT SKIN INDEX
      # ==========================================

      - name: Build complete skin metadata index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          champion_dir = Path("/tmp/champions")

          index = {}

          total_skins = 0
          total_chromas = 0

          for file in sorted(champion_dir.glob("*.json")):

              try:
                  data = json.loads(
                      file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as e:
                  print(
                      f"WARNING: Could not read {file}: {e}"
                  )
                  continue

              champion_data = data.get(
                  "data",
                  {}
              )

              for champion_key, champion in champion_data.items():

                  champion_name = champion.get(
                      "name",
                      champion_key
                  )

                  champion_id = champion.get(
                      "key",
                      champion_key
                  )

                  skins = champion.get(
                      "skins",
                      []
                  )

                  for skin in skins:

                      skin_id = str(
                          skin.get("id", "")
                      ).strip()

                      if not skin_id:
                          continue

                      name = str(
                          skin.get(
                              "name",
                              ""
                          )
                      ).strip()

                      num = skin.get(
                          "num"
                      )

                      parent_skin = skin.get(
                          "parentSkin"
                      )

                      is_chroma = (
                          parent_skin is not None
                      )

                      image_num = num

                      if is_chroma:
                          try:
                              parent_num = int(
                                  parent_skin
                              )

                              for possible_parent in skins:
                                  if (
                                      str(
                                          possible_parent.get(
                                              "num",
                                              ""
                                          )
                                      ) == str(
                                          parent_num
                                      )
                                  ):
                                      image_num = possible_parent.get(
                                          "num"
                                      )
                                      break

                          except Exception:
                              pass

                      image = (
                          f"https://ddragon.leagueoflegends.com/"
                          f"cdn/img/champion/splash/"
                          f"{champion_key}_{image_num}.jpg"
                      )

                      entry = {
                          "id": skin_id,
                          "skinNum": num,
                          "name": name,
                          "champion": champion_name,
                          "championId": champion_key,
                          "image": image
                      }

                      if is_chroma:
                          entry["parentSkin"] = str(
                              parent_skin
                          )

                      index[skin_id] = entry

                      total_skins += 1

                      if is_chroma:
                          total_chromas += 1

          output = Path(
              "/tmp/skin-index.json"
          )

          output.write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("RIOT SKIN INDEX")
          print("==========================================")
          print(f"Total indexed IDs: {len(index)}")
          print(f"Total skins:       {total_skins}")
          print(f"Total chromas:     {total_chromas}")
          print("==========================================")
          PY

      # ==========================================
      # 9. DOWNLOAD COMMUNITYDRAGON FALLBACK
      # ==========================================

      - name: Download CommunityDragon skin metadata
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMMUNITYDRAGON FALLBACK"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/communitydragon-skins.json \
            "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/skins.json"

          python3 <<'PY'
          import json
          from pathlib import Path

          file = Path(
              "/tmp/communitydragon-skins.json"
          )

          data = json.loads(
              file.read_text(
                  encoding="utf-8"
              )
          )

          if isinstance(data, dict):
              if isinstance(data.get("skins"), list):
                  count = len(data["skins"])
              else:
                  count = len(data)
          elif isinstance(data, list):
              count = len(data)
          else:
              count = 0

          print(
              f"CommunityDragon metadata loaded: {count}"
          )
          PY

      # ==========================================
      # 10. GENERATE skins.json
      # ==========================================

      - name: Generate skins.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          fantome_dir = Path("fantome")

          riot_index_file = Path(
              "/tmp/skin-index.json"
          )

          cdragon_file = Path(
              "/tmp/communitydragon-skins.json"
          )

          output_file = Path(
              "data/skins.json"
          )

          # ------------------------------------------
          # RIOT INDEX
          # ------------------------------------------

          riot_index = json.loads(
              riot_index_file.read_text(
                  encoding="utf-8"
              )
          )

          # ------------------------------------------
          # COMMUNITYDRAGON INDEX
          # ------------------------------------------

          raw_cdragon = json.loads(
              cdragon_file.read_text(
                  encoding="utf-8"
              )
          )

          cdragon_index = {}

          if isinstance(raw_cdragon, list):

              for item in raw_cdragon:

                  if not isinstance(item, dict):
                      continue

                  skin_id = str(
                      item.get(
                          "id",
                          ""
                      )
                  ).strip()

                  if skin_id:
                      cdragon_index[skin_id] = item

          elif isinstance(raw_cdragon, dict):

              if isinstance(
                  raw_cdragon.get("skins"),
                  list
              ):

                  for item in raw_cdragon["skins"]:

                      if not isinstance(item, dict):
                          continue

                      skin_id = str(
                          item.get(
                              "id",
                              ""
                          )
                      ).strip()

                      if skin_id:
                          cdragon_index[skin_id] = item

              else:

                  for key, item in raw_cdragon.items():

                      if not isinstance(item, dict):
                          continue

                      skin_id = str(
                          item.get(
                              "id",
                              key
                          )
                      ).strip()

                      if skin_id:
                          cdragon_index[skin_id] = item

          print(
              f"CommunityDragon indexed IDs: "
              f"{len(cdragon_index)}"
          )

          # ------------------------------------------
          # FANTOME FILES
          # ------------------------------------------

          fantome_files = sorted(
              [
                  p
                  for p in fantome_dir.iterdir()
                  if p.is_file()
                  and p.suffix.lower() == ".fantome"
              ],
              key=lambda p: int(
                  re.sub(
                      r"\D",
                      "",
                      p.stem
                  ) or 0
              )
          )

          matched = []
          fallback_matched = []
          not_found = []

          # ------------------------------------------
          # HELPERS
          # ------------------------------------------

          def clean(value):
              if value is None:
                  return ""

              return str(value).strip()

          def first_value(item, *keys):
              for key in keys:
                  value = item.get(key)

                  if value is not None:
                      value = clean(value)

                      if value:
                          return value

              return ""

          def build_fallback_entry(
              skin_id,
              item
          ):

              # CommunityDragon uses slightly
              # different metadata structures
              # between versions, so support
              # several possible field names.

              name = first_value(
                  item,
                  "name",
                  "displayName"
              )

              champion_name = first_value(
                  item,
                  "championName",
                  "champion",
                  "characterName"
              )

              champion_id = first_value(
                  item,
                  "championId",
                  "characterId",
                  "championKey"
              )

              skin_num = item.get(
                  "num"
              )

              # --------------------------------------
              # Try nested champion data
              # --------------------------------------

              champion = item.get(
                  "champion"
              )

              if isinstance(
                  champion,
                  dict
              ):

                  if not champion_name:
                      champion_name = first_value(
                          champion,
                          "name",
                          "displayName"
                      )

                  if not champion_id:
                      champion_id = first_value(
                          champion,
                          "id",
                          "key"
                      )

              # --------------------------------------
              # Image
              # --------------------------------------

              image = first_value(
                  item,
                  "splash",
                  "splashPath",
                  "image",
                  "uncenteredSplashPath",
                  "tilePath"
              )

              # If CommunityDragon provides
              # an absolute URL, keep it.
              #
              # If it gives an internal path,
              # convert it to a CommunityDragon URL.

              if image:

                  if image.startswith(
                      "/"
                  ):

                      image = (
                          "https://raw.communitydragon.org/latest"
                          + image
                      )

                  elif image.startswith(
                      "http://"
                  ):

                      image = (
                          "https://"
                          + image[7:]
                      )

              # --------------------------------------
              # Fallback image from Riot splash
              # --------------------------------------

              if (
                  not image
                  and champion_id
                  and skin_num is not None
              ):

                  # champion_id may be a numeric Riot
                  # key. CommunityDragon may also give
                  # champion name separately.

                  champion_key = (
                      champion_name
                      if champion_name
                      else champion_id
                  )

                  image = (
                      "https://ddragon.leagueoflegends.com/"
                      "cdn/img/champion/splash/"
                      f"{champion_key}_{skin_num}.jpg"
                  )

              if not name:
                  name = (
                      f"Skin {skin_id}"
                  )

              if not champion_name:
                  champion_name = (
                      "Unknown"
                  )

              if not champion_id:
                  champion_id = (
                      champion_name
                  )

              entry = {
                  "id": skin_id,
                  "skinNum": skin_num,
                  "name": name,
                  "champion": champion_name,
                  "championId": champion_id,
                  "image": image
              }

              # Preserve parent skin if available.

              parent_skin = item.get(
                  "parentSkin"
              )

              if parent_skin is not None:

                  entry["parentSkin"] = str(
                      parent_skin
                  )

              return entry

          # ------------------------------------------
          # MATCH EVERY FANTOME
          # ------------------------------------------

          for file in fantome_files:

              skin_id = file.stem.strip()

              numeric_match = re.search(
                  r"\d+",
                  skin_id
              )

              numeric_id = (
                  numeric_match.group(0)
                  if numeric_match
                  else skin_id
              )

              # ======================================
              # 1. RIOT DATA DRAGON
              # ======================================

              skin = riot_index.get(
                  skin_id
              )

              if skin is None:

                  skin = riot_index.get(
                      numeric_id
                  )

              if skin is not None:

                  matched.append(
                      skin
                  )

                  continue

              # ======================================
              # 2. COMMUNITYDRAGON FALLBACK
              # ======================================

              cdragon_skin = cdragon_index.get(
                  skin_id
              )

              if cdragon_skin is None:

                  cdragon_skin = cdragon_index.get(
                      numeric_id
                  )

              if cdragon_skin is not None:

                  fallback = build_fallback_entry(
                      numeric_id,
                      cdragon_skin
                  )

                  fallback_matched.append(
                      fallback
                  )

                  continue

              # ======================================
              # 3. NOT FOUND
              # ======================================

              not_found.append(
                  numeric_id
              )

          # ------------------------------------------
          # MERGE
          # ------------------------------------------

          unique = {}

          for skin in matched:
              unique[
                  str(skin["id"])
              ] = skin

          for skin in fallback_matched:
              unique[
                  str(skin["id"])
              ] = skin

          result_skins = list(
              unique.values()
          )

          # ------------------------------------------
          # SORT
          # ------------------------------------------

          def sort_key(item):

              champion = str(
                  item.get(
                      "champion",
                      ""
                  )
              ).lower()

              try:
                  skin_id = int(
                      str(
                          item.get(
                              "id",
                              "0"
                          )
                      )
                  )

              except Exception:
                  skin_id = 0

              return (
                  champion,
                  skin_id
              )

          result_skins.sort(
              key=sort_key
          )

          # ------------------------------------------
          # REMOVE DUPLICATE NOT FOUND IDS
          # ------------------------------------------

          not_found = sorted(
              set(
                  not_found
              ),
              key=lambda x: int(
                  x
              )
              if x.isdigit()
              else 0
          )

          # ------------------------------------------
          # OUTPUT
          # ------------------------------------------

          riot_version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          result = {
              "version": riot_version,
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "skins": result_skins
          }

          output_file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ------------------------------------------
          # REPORT
          # ------------------------------------------

          print("")
          print("==============================")
          print("SKIN SYNC RESULT")
          print("==============================")
          print(
              f"Fantome files:       {len(fantome_files)}"
          )
          print(
              f"Riot matched:        {len(matched)}"
          )
          print(
              f"CommunityDragon:     {len(fallback_matched)}"
          )
          print(
              f"Total matched:       {len(result_skins)}"
          )
          print(
              f"Not found:           {len(not_found)}"
          )
          print("==============================")

          if fallback_matched:

              print("")
              print(
                  "CommunityDragon fallback IDs:"
              )

              for skin in fallback_matched:
                  print(
                      f"  {skin['id']} "
                      f"-> "
                      f"{skin['champion']} "
                      f"-> "
                      f"{skin['name']}"
                  )

          if not_found:

              print("")
              print(
                  "Not found IDs:"
              )

              for skin_id in not_found[:100]:
                  print(
                      f"  {skin_id}"
                  )

          print("")
          print(
              "skins.json generated successfully."
          )
          PY

      # ==========================================
      # 11. GENERATE FANTOME FILE LIST
      # ==========================================

      - name: Generate fantome-files.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("fantome")

          files = sorted(
              p.name
              for p in folder.iterdir()
              if p.is_file()
              and p.suffix.lower() == ".fantome"
          )

          output = Path(
              "data/fantome-files.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Fantome files indexed: {len(files)}"
          )
          PY

      # ==========================================
      # 12. VERIFY GENERATED DATA
      # ==========================================

      - name: Verify generated data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          skins_file = Path(
              "data/skins.json"
          )

          fantome_file = Path(
              "data/fantome-files.json"
          )

          skins = json.loads(
              skins_file.read_text(
                  encoding="utf-8"
              )
          )

          fantomes = json.loads(
              fantome_file.read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(
              skins.get("skins"),
              list
          )

          assert isinstance(
              fantomes,
              list
          )

          print(
              f"skins.json entries: "
              f"{len(skins['skins'])}"
          )

          print(
              f"fantome-files.json entries: "
              f"{len(fantomes)}"
          )

          print(
              "Generated JSON files are valid."
          )
          PY

      # ==========================================
      # 13. SHOW CHANGES
      # ==========================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- \
            fantome \
            data/skins.json \
            data/fantome-files.json
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ""
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "Changes detected."
          fi

      # ==========================================
      # 14. COMMIT
      # ==========================================

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fantome \
            data/skins.json \
            data/fantome-files.json

          git commit \
            -m "chore: sync League skins"

          git push