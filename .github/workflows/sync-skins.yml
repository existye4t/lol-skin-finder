name: Sync League Skins

on:
  schedule:
    # Her 6 saatte bir
    - cron: "0 */6 * * *"

  # Actions içerisinden manuel çalıştırma
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. KENDİ REPO'MUZU ÇEK
      # =====================================================

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # =====================================================
      # 2. LEAGUESKINS REPOSUNU ÇEK
      # =====================================================

      - name: Checkout LeagueSkins repository
        uses: actions/checkout@v6
        with:
          repository: Alban1911/LeagueSkins
          path: source-skins
          fetch-depth: 1


      # =====================================================
      # 3. FANTOME KLASÖRÜNÜ TEMİZLE
      # =====================================================

      - name: Prepare Fantome directory
        shell: bash
        run: |
          set -e

          mkdir -p fantome
          mkdir -p data

          echo "Cleaning old Fantome files..."

          find fantome \
            -type f \
            -iname "*.fantome" \
            -delete

          echo "Fantome directory ready."


      # =====================================================
      # 4. FANTOME DOSYALARINI KOPYALA
      # =====================================================

      - name: Sync Fantome files
        shell: bash
        run: |
          set -e

          echo "Finding Fantome files..."

          count=0

          while IFS= read -r -d '' file; do

            filename="$(basename "$file")"

            cp -f \
              "$file" \
              "fantome/$filename"

            count=$((count + 1))

          done < <(
            find source-skins/skins \
              -type f \
              -iname "*.fantome" \
              -print0
          )

          echo ""
          echo "Fantome files synced."
          echo "Total: $count"


      # =====================================================
      # 5. COMMUNITYDRAGON'DAN GÜNCEL SKIN VERİSİ
      # =====================================================

      - name: Download latest skin metadata
        shell: bash
        run: |
          set -e

          echo "Downloading latest League skin metadata..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -L \
            "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/skins.json" \
            -o data/communitydragon-skins.json

          echo "Skin metadata downloaded."

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/communitydragon-skins.json")

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              f"CommunityDragon skin records: {len(data)}"
          )
          PY


      # =====================================================
      # 6. FANTOME-FILES.JSON OLUŞTUR
      # =====================================================

      - name: Generate fantome-files.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("fantome")

          files = sorted(
              path.name
              for path in folder.iterdir()
              if path.is_file()
              and path.suffix.lower() == ".fantome"
          )

          output = Path(
              "data/fantome-files.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Found {len(files)} Fantome files."
          )

          print(
              f"Written to {output}"
          )
          PY


      # =====================================================
      # 7. SKINS.JSON'I OTOMATİK OLUŞTUR
      # =====================================================

      - name: Generate skins.json from Fantome IDs
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timezone

          fantome_dir = Path("fantome")

          metadata_file = Path(
              "data/communitydragon-skins.json"
          )

          output_file = Path(
              "data/skins.json"
          )


          # =================================================
          # COMMUNITYDRAGON VERİSİNİ OKU
          # =================================================

          raw = json.loads(
              metadata_file.read_text(
                  encoding="utf-8"
              )
          )


          # =================================================
          # FARKLI JSON FORMATLARINI DESTEKLE
          # =================================================

          if isinstance(raw, dict):

              if isinstance(
                  raw.get("skins"),
                  list
              ):
                  metadata = raw["skins"]

              else:
                  metadata = []

                  for value in raw.values():

                      if isinstance(
                          value,
                          dict
                      ):
                          metadata.append(
                              value
                          )

          elif isinstance(raw, list):

              metadata = raw

          else:

              metadata = []


          # =================================================
          # ID -> SKIN MAP
          # =================================================

          skin_map = {}


          for skin in metadata:

              if not isinstance(
                  skin,
                  dict
              ):
                  continue

              possible_ids = [
                  skin.get("id"),
                  skin.get("skinId"),
                  skin.get("contentId"),
              ]

              for possible_id in possible_ids:

                  if possible_id is None:
                      continue

                  skin_id = str(
                      possible_id
                  ).strip()

                  if skin_id:
                      skin_map[skin_id] = skin


          print(
              f"Indexed metadata skins: {len(skin_map)}"
          )


          # =================================================
          # CHAMPION BİLGİSİNİ AL
          # =================================================

          champion_cache = {}


          def get_champion_id(skin):

              for key in (
                  "championId",
                  "champion_id",
                  "champion",
              ):

                  value = skin.get(key)

                  if value is not None:

                      if isinstance(
                          value,
                          dict
                      ):

                          for nested_key in (
                              "id",
                              "name",
                              "alias",
                          ):

                              nested = value.get(
                                  nested_key
                              )

                              if nested:
                                  return str(
                                      nested
                                  )

                      else:

                          return str(
                              value
                          )

              return ""


          def get_name(skin):

              for key in (
                  "name",
                  "displayName",
                  "title",
              ):

                  value = skin.get(key)

                  if value:

                      return str(
                          value
                      ).strip()

              return ""


          def get_image(skin):

              # CommunityDragon'ın farklı
              # metadata formatlarını destekle

              for key in (
                  "loadScreenPath",
                  "splashPath",
                  "splash",
                  "image",
                  "iconPath",
              ):

                  value = skin.get(key)

                  if not value:
                      continue

                  value = str(
                      value
                  )

                  if value.startswith(
                      "http://"
                  ) or value.startswith(
                      "https://"
                  ):

                      return value


              # Bazı skin kayıtlarında
              # splashPath bulunabiliyor.

              for key in (
                  "loadScreen",
                  "splashImage",
                  "imagePath",
              ):

                  value = skin.get(key)

                  if not value:
                      continue

                  value = str(
                      value
                  )

                  if value.startswith(
                      "/lol-game-data/assets/"
                  ):

                      path = value.replace(
                          "/lol-game-data/assets/",
                          ""
                      ).lower()

                      return (
                          "https://raw.communitydragon.org/latest/"
                          "plugins/rcp-be-lol-game-data/"
                          "global/default/"
                          + path
                      )

              return ""


          def get_champion_name(
              skin
          ):

              champion = skin.get(
                  "champion"
              )

              if isinstance(
                  champion,
                  dict
              ):

                  for key in (
                      "name",
                      "alias",
                      "id",
                  ):

                      value = champion.get(
                          key
                      )

                      if value:
                          return str(
                              value
                          ).strip()

              elif champion:

                  return str(
                      champion
                  ).strip()


              for key in (
                  "championName",
                  "champion",
                  "characterName",
                  "alias",
              ):

                  value = skin.get(key)

                  if value:

                      return str(
                          value
                      ).strip()

              return "Unknown"


          def get_skin_num(skin):

              for key in (
                  "skinNum",
                  "num",
                  "number",
              ):

                  value = skin.get(key)

                  if value is not None:

                      try:
                          return int(
                              value
                          )
                      except Exception:
                          pass

              return 0


          # =================================================
          # FANTOME ID'LERİNİ AL
          # =================================================

          fantome_ids = []

          for file in sorted(
              fantome_dir.glob(
                  "*.fantome"
              )
          ):

              match = re.match(
                  r"^(\d+)\.fantome$",
                  file.name,
                  re.IGNORECASE
              )

              if not match:

                  print(
                      "WARNING: Invalid Fantome filename:",
                      file.name
                  )

                  continue

              skin_id = match.group(
                  1
              )

              fantome_ids.append(
                  skin_id
              )


          # =================================================
          # SKIN VERİLERİNİ OLUŞTUR
          # =================================================

          skins = []

          not_found = []


          for skin_id in fantome_ids:

              skin = skin_map.get(
                  skin_id
              )

              if skin is None:

                  not_found.append(
                      skin_id
                  )

                  continue


              name = get_name(
                  skin
              )

              champion = get_champion_name(
                  skin
              )

              champion_id = get_champion_id(
                  skin
              )

              image = get_image(
                  skin
              )

              skin_num = get_skin_num(
                  skin
              )


              if not name:

                  name = (
                      f"Skin {skin_id}"
                  )


              if not champion:

                  champion = "Unknown"


              skins.append(
                  {
                      "id": skin_id,

                      "skinNum": skin_num,

                      "name": name,

                      "champion": champion,

                      "championId":
                          champion_id,

                      "image": image
                  }
              )


          # =================================================
          # ID'YE GÖRE SIRALA
          # =================================================

          skins.sort(
              key=lambda x: int(
                  x["id"]
              )
          )


          # =================================================
          # SONUCU YAZ
          # =================================================

          output = {
              "version": "auto",

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "skins": skins
          }


          output_file.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # =================================================
          # RAPOR
          # =================================================

          print("")
          print("==============================")
          print("SKIN SYNC RESULT")
          print("==============================")
          print(
              f"Fantome files: {len(fantome_ids)}"
          )
          print(
              f"Matched skins: {len(skins)}"
          )
          print(
              f"Not found: {len(not_found)}"
          )


          if not_found:

              print("")
              print(
                  "WARNING: Skin ID not found:"
              )

              # Hepsini log'a basmak yerine
              # ilk 100 tanesini göster.

              for skin_id in not_found[:100]:

                  print(
                      f"  - {skin_id}"
                  )

              if len(not_found) > 100:

                  print(
                      f"  ... and "
                      f"{len(not_found) - 100} more"
                  )


          print("")
          print(
              f"Written to {output_file}"
          )
          PY


      # =====================================================
      # 8. ESKİ COMMUNITYDRAGON JSON'INI SİL
      # =====================================================

      - name: Remove temporary metadata
        shell: bash
        run: |
          rm -f data/communitydragon-skins.json


      # =====================================================
      # 9. DOSYA KONTROLÜ
      # =====================================================

      - name: Validate generated data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          skins_file = Path(
              "data/skins.json"
          )

          files_file = Path(
              "data/fantome-files.json"
          )

          skins_data = json.loads(
              skins_file.read_text(
                  encoding="utf-8"
              )
          )

          fantome_files = json.loads(
              files_file.read_text(
                  encoding="utf-8"
              )
          )

          skins = skins_data.get(
              "skins",
              []
          )

          skin_ids = {
              str(
                  skin["id"]
              )
              for skin in skins
          }

          fantome_ids = {
              Path(
                  name
              ).stem
              for name in fantome_files
              if str(name).lower().endswith(
                  ".fantome"
              )
          }

          print(
              f"skins.json entries: {len(skins)}"
          )

          print(
              f"Fantome entries: {len(fantome_files)}"
          )

          print(
              f"Matched IDs: {len(skin_ids & fantome_ids)}"
          )

          print(
              f"Unmatched Fantome IDs: "
              f"{len(fantome_ids - skin_ids)}"
          )

          if not skins:

              raise SystemExit(
                  "ERROR: skins.json is empty!"
              )

          if not fantome_files:

              raise SystemExit(
                  "ERROR: No Fantome files found!"
              )

          print(
              "Validation successful."
          )
          PY


      # =====================================================
      # 10. GIT DEĞİŞİKLİKLERİNİ KONTROL ET
      # =====================================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then

            echo "changed=false" \
              >> "$GITHUB_OUTPUT"

            echo ""
            echo "No changes detected."

          else

            echo "changed=true" \
              >> "$GITHUB_OUTPUT"

            echo ""
            echo "Changes detected."

            git status --short

          fi


      # =====================================================
      # 11. COMMIT + PUSH
      # =====================================================

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fantome \
            data/skins.json \
            data/fantome-files.json

          git commit \
            -m "chore: sync League skins"

          git push