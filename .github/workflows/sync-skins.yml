name: Sync League Skins

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-skin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. WEBSITE REPOSITORY
      # ============================================================

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ============================================================
      # 2. LEAGUESKINS REPOSITORY
      # ============================================================

      - name: Checkout LeagueSkins repository
        uses: actions/checkout@v6
        with:
          repository: Alban1911/LeagueSkins
          path: source-skins
          fetch-depth: 1

      # ============================================================
      # 3. PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ============================================================
      # 4. PREPARE DIRECTORIES
      # ============================================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p fantome
          mkdir -p data

          echo "Directories ready."

      # ============================================================
      # 5. SYNC FANTOME FILES
      # ============================================================

      - name: Sync Fantome files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING FANTOME FILES"
          echo "=========================================="

          rm -rf fantome
          mkdir -p fantome

          count=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"

            cp -f "$file" "fantome/$filename"

            count=$((count + 1))
          done < <(
            find source-skins/skins \
              -type f \
              -iname "*.fantome" \
              -print0
          )

          echo ""
          echo "Fantome files copied: $count"

      # ============================================================
      # 6. DOWNLOAD RIOT VERSION
      # ============================================================

      - name: Download latest Riot Data Dragon version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RIOT DATA"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/versions.json \
            https://ddragon.leagueoflegends.com/api/versions.json

          VERSION=$(python3 - <<'PY'
          import json

          with open("/tmp/versions.json", "r", encoding="utf-8") as f:
              versions = json.load(f)

          print(versions[0])
          PY
          )

          echo "Riot version: $VERSION"

          echo "$VERSION" > /tmp/riot-version.txt

      # ============================================================
      # 7. DOWNLOAD RIOT CHAMPION METADATA
      # ============================================================

      - name: Download champion metadata
        shell: bash
        run: |
          set -e

          VERSION="$(cat /tmp/riot-version.txt)"

          mkdir -p /tmp/champions

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/champion.json \
            "https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/en_US/champion.json"

          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          data = json.loads(
              Path("/tmp/champion.json").read_text(
                  encoding="utf-8"
              )
          )

          champions = data.get("data", {})

          print(
              f"Champions found: {len(champions)}"
          )

          for champion_id in champions:

              url = (
                  "https://ddragon.leagueoflegends.com/"
                  f"cdn/{version}/data/en_US/champion/"
                  f"{champion_id}.json"
              )

              output = (
                  Path("/tmp/champions")
                  / f"{champion_id}.json"
              )

              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--retry",
                      "5",
                      "--retry-delay",
                      "2",
                      "-sS",
                      "-o",
                      str(output),
                      url
                  ],
                  check=True
              )

          print("All champion metadata downloaded.")
          PY

      # ============================================================
      # 8. BUILD RIOT SKIN INDEX
      # ============================================================

      - name: Build Riot skin metadata index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          champion_dir = Path("/tmp/champions")

          index = {}

          for file in sorted(
              champion_dir.glob("*.json")
          ):

              try:
                  data = json.loads(
                      file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  continue

              for champion_key, champion in data.get(
                  "data",
                  {}
              ).items():

                  champion_name = str(
                      champion.get(
                          "name",
                          champion_key
                      )
                  ).strip()

                  champion_id = str(
                      champion.get(
                          "key",
                          champion_key
                      )
                  ).strip()

                  skins = champion.get(
                      "skins",
                      []
                  )

                  for skin in skins:

                      skin_id = str(
                          skin.get(
                              "id",
                              ""
                          )
                      ).strip()

                      if not skin_id:
                          continue

                      skin_num = skin.get(
                          "num"
                      )

                      parent_skin = skin.get(
                          "parentSkin"
                      )

                      image_num = skin_num

                      if parent_skin is not None:

                          for parent in skins:

                              if str(
                                  parent.get(
                                      "num",
                                      ""
                                  )
                              ) == str(
                                  parent_skin
                              ):
                                  image_num = parent.get(
                                      "num"
                                  )
                                  break

                      image = (
                          "https://ddragon.leagueoflegends.com/"
                          "cdn/img/champion/splash/"
                          f"{champion_key}_{image_num}.jpg"
                      )

                      entry = {
                          "id": skin_id,
                          "skinNum": skin_num,
                          "name": str(
                              skin.get(
                                  "name",
                                  ""
                              )
                          ).strip(),
                          "champion": champion_name,
                          "championId": champion_id,
                          "image": image
                      }

                      if parent_skin is not None:
                          entry["parentSkin"] = str(
                              parent_skin
                          )

                      index[skin_id] = entry

          Path(
              "/tmp/riot-skin-index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"Riot indexed IDs: {len(index)}"
          )
          PY

      # ============================================================
      # 9. DOWNLOAD COMMUNITYDRAGON DATA
      # ============================================================

      - name: Download CommunityDragon skin metadata
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMMUNITYDRAGON"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/cdragon-skins.json \
            "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/skins.json"

          echo "CommunityDragon downloaded."

      # ============================================================
      # 10. BUILD COMMUNITYDRAGON INDEX
      # ============================================================

      - name: Build CommunityDragon index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          source = json.loads(
              Path(
                  "/tmp/cdragon-skins.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          index = {}

          if isinstance(source, list):

              entries = source

          elif isinstance(source, dict):

              if isinstance(
                  source.get("skins"),
                  list
              ):
                  entries = source["skins"]

              elif isinstance(
                  source.get("data"),
                  list
              ):
                  entries = source["data"]

              elif isinstance(
                  source.get("data"),
                  dict
              ):
                  entries = list(
                      source["data"].values()
                  )

              else:
                  entries = []

          else:
              entries = []

          for entry in entries:

              if not isinstance(
                  entry,
                  dict
              ):
                  continue

              possible_ids = [
                  entry.get("id"),
                  entry.get("skinId"),
                  entry.get("contentId"),
                  entry.get("catalogEntryId"),
                  entry.get("itemId")
              ]

              skin_id = None

              for value in possible_ids:

                  if value is None:
                      continue

                  value = str(
                      value
                  ).strip()

                  if value.isdigit():

                      skin_id = str(
                          int(value)
                      )

                      break

              if not skin_id:
                  continue

              name = (
                  entry.get("name")
                  or entry.get("displayName")
                  or entry.get("skinName")
                  or ""
              )

              champion_name = (
                  entry.get("championName")
                  or entry.get("champion")
                  or ""
              )

              champion_id = (
                  entry.get("championId")
                  or entry.get("characterId")
                  or ""
              )

              result = {
                  "id": skin_id,
                  "name": str(name).strip(),
                  "champion": str(
                      champion_name
                  ).strip(),
                  "championId": str(
                      champion_id
                  ).strip()
              }

              if entry.get("isBase") is not True:
                  if "skinLine" in entry:
                      result["skinLine"] = entry.get(
                          "skinLine"
                      )

              index[skin_id] = result

          Path(
              "/tmp/cdragon-skin-index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"CommunityDragon indexed IDs: {len(index)}"
          )
          PY

      # ============================================================
      # 11. BUILD LEAGUESKINS PATH INDEX
      #
      # Example:
      #
      # skins/21/21016/21997/21997.fantome
      #
      # We keep the original source path information here.
      # ============================================================

      - name: Build LeagueSkins source index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path(
              "source-skins/skins"
          )

          index = {}

          files = list(
              root.rglob("*.fantome")
          )

          print(
              f"LeagueSkins Fantome files: {len(files)}"
          )

          for file in files:

              filename_id = file.stem.strip()

              if not filename_id.isdigit():
                  continue

              skin_id = str(
                  int(filename_id)
              )

              relative = file.relative_to(
                  root
              )

              parts = relative.parts

              champion_numeric_id = ""
              champion_skin_numeric_id = ""

              if len(parts) >= 4:

                  # Example:
                  # 21 / 21016 / 21997 / 21997.fantome

                  if parts[0].isdigit():
                      champion_numeric_id = str(
                          int(parts[0])
                      )

                  if parts[1].isdigit():
                      champion_skin_numeric_id = str(
                          int(parts[1])
                      )

              index[skin_id] = {
                  "id": skin_id,
                  "sourcePath": str(
                      relative
                  ).replace(
                      "\\",
                      "/"
                  ),
                  "championNumericId":
                      champion_numeric_id,
                  "championSkinNumericId":
                      champion_skin_numeric_id
              }

          Path(
              "/tmp/leagueskins-index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              f"LeagueSkins indexed IDs: {len(index)}"
          )
          PY

      # ============================================================
      # 12. GENERATE skins.json
      # ============================================================

      - name: Generate skins.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          fantome_dir = Path(
              "fantome"
          )

          riot_index = json.loads(
              Path(
                  "/tmp/riot-skin-index.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          cdragon_index = json.loads(
              Path(
                  "/tmp/cdragon-skin-index.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          leagueskins_index = json.loads(
              Path(
                  "/tmp/leagueskins-index.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          fantome_files = sorted(
              [
                  p
                  for p in fantome_dir.iterdir()
                  if p.is_file()
                  and p.suffix.lower() == ".fantome"
              ],
              key=lambda p: (
                  int(
                      re.sub(
                          r"\D",
                          "",
                          p.stem
                      ) or 0
                  ),
                  p.name
              )
          )

          matched = {}

          riot_matched = 0
          cdragon_matched = 0
          fallback_matched = 0

          not_found = []

          def normalize_id(value):

              value = str(
                  value
              ).strip()

              if value.isdigit():

                  return str(
                      int(value)
                  )

              match = re.search(
                  r"\d+",
                  value
              )

              if match:

                  return str(
                      int(
                          match.group(0)
                      )
                  )

              return None

          # --------------------------------------------------------
          # Helper: Riot splash
          # --------------------------------------------------------

          def riot_splash(
              champion_id,
              skin_num
          ):

              if not champion_id:
                  return ""

              if skin_num is None:
                  return ""

              return (
                  "https://ddragon.leagueoflegends.com/"
                  "cdn/img/champion/splash/"
                  f"{champion_id}_{skin_num}.jpg"
              )

          # --------------------------------------------------------
          # Process every Fantome
          # --------------------------------------------------------

          for file in fantome_files:

              original_id = file.stem.strip()

              skin_id = normalize_id(
                  original_id
              )

              if not skin_id:

                  not_found.append(
                      original_id
                  )

                  continue

              # ====================================================
              # A. RIOT
              # ====================================================

              skin = riot_index.get(
                  skin_id
              )

              source = "Riot"

              if skin is not None:

                  riot_matched += 1

              # ====================================================
              # B. COMMUNITYDRAGON
              # ====================================================

              else:

                  skin = cdragon_index.get(
                      skin_id
                  )

                  source = "CommunityDragon"

                  if skin is not None:

                      cdragon_matched += 1

              # ====================================================
              # C. LEAGUESKINS SOURCE FALLBACK
              #
              # We DON'T invent a skin name.
              #
              # However, if the source path itself contains
              # useful numeric information, keep that information
              # available for later resolution.
              # ====================================================

              if skin is None:

                  source_info = (
                      leagueskins_index.get(
                          skin_id
                      )
                  )

                  if source_info:

                      champion_numeric_id = (
                          source_info.get(
                              "championNumericId",
                              ""
                          )
                      )

                      champion_skin_numeric_id = (
                          source_info.get(
                              "championSkinNumericId",
                              ""
                          )
                      )

                      # ------------------------------------------------
                      # Try to derive the champion from the Riot
                      # champion numeric key.
                      # ------------------------------------------------

                      champion = None
                      champion_key = None

                      if champion_numeric_id:

                          for riot_skin in riot_index.values():

                              if str(
                                  riot_skin.get(
                                      "championId",
                                      ""
                                  )
                              ) == str(
                                  champion_numeric_id
                              ):

                                  champion = riot_skin.get(
                                      "champion"
                                  )

                                  champion_key = riot_skin.get(
                                      "championId"
                                  )

                                  break

                      # ------------------------------------------------
                      # If we can determine champion, create a safe
                      # fallback entry.
                      #
                      # We still don't invent a skin title.
                      # ------------------------------------------------

                      if champion:

                          skin = {
                              "id": skin_id,
                              "skinNum": None,
                              "name": f"Skin {skin_id}",
                              "champion": champion,
                              "championId": champion_key,
                              "image": ""
                          }

                          fallback_matched += 1

                          source = (
                              "LeagueSkinsFallback"
                          )

              # ====================================================
              # D. NOTHING FOUND
              # ====================================================

              if skin is None:

                  not_found.append(
                      original_id
                  )

                  continue

              skin = dict(
                  skin
              )

              skin["id"] = skin_id

              skin["name"] = str(
                  skin.get(
                      "name",
                      ""
                  )
              ).strip()

              skin["champion"] = str(
                  skin.get(
                      "champion",
                      ""
                  )
              ).strip()

              skin["championId"] = str(
                  skin.get(
                      "championId",
                      ""
                  )
              ).strip()

              # ====================================================
              # IMAGE HANDLING
              #
              # IMPORTANT:
              #
              # We do NOT use 21997.png from LeagueSkins.
              #
              # First preference:
              # Riot Data Dragon splash.
              #
              # If unavailable:
              # CommunityDragon splash.
              # ====================================================

              current_image = str(
                  skin.get(
                      "image",
                      ""
                  )
              ).strip()

              skin_num = skin.get(
                  "skinNum"
              )

              champion_id = skin.get(
                  "championId",
                  ""
              )

              # If Riot metadata gave us skinNum,
              # always construct the normal splash.
              if champion_id and skin_num is not None:

                  splash = riot_splash(
                      champion_id,
                      skin_num
                  )

                  if splash:

                      skin["image"] = splash

              elif not (
                  current_image.startswith(
                      "http://"
                  )
                  or current_image.startswith(
                      "https://"
                  )
              ):

                  skin["image"] = ""

              # ====================================================
              # Remove internal fields
              # ====================================================

              skin.pop(
                  "sourcePath",
                  None
              )

              skin.pop(
                  "_metadataSource",
                  None
              )

              # ====================================================
              # Keep source only internally
              # ====================================================

              matched[skin_id] = skin

          # ========================================================
          # SORT
          # ========================================================

          skins = list(
              matched.values()
          )

          def sort_key(item):

              champion = str(
                  item.get(
                      "champion",
                      ""
                  )
              ).lower()

              try:

                  numeric_id = int(
                      str(
                          item.get(
                              "id",
                              "0"
                          )
                      )
                  )

              except Exception:

                  numeric_id = 0

              return (
                  champion,
                  numeric_id
              )

          skins.sort(
              key=sort_key
          )

          # ========================================================
          # OUTPUT
          # ========================================================

          riot_version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          result = {
              "version": riot_version,
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "skins": skins
          }

          output = Path(
              "data/skins.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # ========================================================
          # LOG
          # ========================================================

          print("")
          print("==============================")
          print("SKIN SYNC RESULT")
          print("==============================")
          print(
              f"Fantome files:       {len(fantome_files)}"
          )
          print(
              f"Riot matched:        {riot_matched}"
          )
          print(
              f"CommunityDragon:     {cdragon_matched}"
          )
          print(
              f"LeagueSkins fallback:{fallback_matched}"
          )
          print(
              f"Total matched:       {len(skins)}"
          )
          print(
              f"Not found:           {len(not_found)}"
          )
          print("==============================")

          if not_found:

              print("")
              print(
                  "Not found IDs:"
              )

              for skin_id in not_found[:100]:

                  print(
                      f"  {skin_id}"
                  )

          print("")
          print(
              "skins.json generated successfully."
          )
          PY

      # ============================================================
      # 13. GENERATE FANTOME FILE LIST
      # ============================================================

      - name: Generate fantome-files.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path(
              "fantome"
          )

          files = sorted(
              p.name
              for p in folder.iterdir()
              if p.is_file()
              and p.suffix.lower() == ".fantome"
          )

          output = Path(
              "data/fantome-files.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Fantome files indexed: {len(files)}"
          )
          PY

      # ============================================================
      # 14. VERIFY
      # ============================================================

      - name: Verify generated data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          skins_file = Path(
              "data/skins.json"
          )

          fantome_file = Path(
              "data/fantome-files.json"
          )

          skins = json.loads(
              skins_file.read_text(
                  encoding="utf-8"
              )
          )

          fantomes = json.loads(
              fantome_file.read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(
              skins.get("skins"),
              list
          )

          assert isinstance(
              fantomes,
              list
          )

          ids = set()

          for skin in skins["skins"]:

              skin_id = str(
                  skin.get(
                      "id",
                      ""
                  )
              )

              assert skin_id

              assert skin.get(
                  "champion"
              ) is not None

              assert skin.get(
                  "name"
              ) is not None

              ids.add(
                  skin_id
              )

          print(
              f"skins.json entries: "
              f"{len(skins['skins'])}"
          )

          print(
              f"Unique skin IDs: "
              f"{len(ids)}"
          )

          print(
              f"fantome-files.json entries: "
              f"{len(fantomes)}"
          )

          print(
              "Generated JSON files are valid."
          )
          PY

      # ============================================================
      # 15. CHECK CHANGES
      # ============================================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -e

          git status --short

          if git diff --quiet -- \
            fantome \
            data/skins.json \
            data/fantome-files.json
          then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "No changes detected."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Changes detected."

          fi

      # ============================================================
      # 16. COMMIT AND PUSH
      # ============================================================

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fantome \
            data/skins.json \
            data/fantome-files.json

          git commit \
            -m "chore: sync League skins"

          git push