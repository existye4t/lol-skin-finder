name: Sync League Skins

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-skin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. WEBSITE REPOSITORY
      # ==========================================

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================
      # 2. LEAGUESKINS REPOSITORY
      # ==========================================

      - name: Checkout LeagueSkins repository
        uses: actions/checkout@v6
        with:
          repository: Alban1911/LeagueSkins
          path: source-skins
          fetch-depth: 1

      # ==========================================
      # 3. PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ==========================================
      # 4. PREPARE DIRECTORIES
      # ==========================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p fantome
          mkdir -p data

          echo "Directories ready."

      # ==========================================
      # 5. SYNC FANTOME FILES
      # ==========================================

      - name: Sync Fantome files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING FANTOME FILES"
          echo "=========================================="

          rm -rf fantome
          mkdir -p fantome

          count=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"

            cp -f "$file" "fantome/$filename"

            count=$((count + 1))
          done < <(
            find source-skins/skins \
              -type f \
              -iname "*.fantome" \
              -print0
          )

          echo ""
          echo "Fantome files copied: $count"

      # ==========================================
      # 6. DOWNLOAD RIOT DATA DRAGON VERSION
      # ==========================================

      - name: Download latest Riot Data Dragon version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RIOT DATA"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/versions.json \
            https://ddragon.leagueoflegends.com/api/versions.json

          VERSION=$(python3 - <<'PY'
          import json

          with open("/tmp/versions.json", "r", encoding="utf-8") as f:
              versions = json.load(f)

          print(versions[0])
          PY
          )

          echo "Riot Data Dragon version: $VERSION"

          echo "$VERSION" > /tmp/riot-version.txt

      # ==========================================
      # 7. DOWNLOAD ALL CHAMPION METADATA
      # ==========================================

      - name: Download champion metadata
        shell: bash
        run: |
          set -e

          VERSION="$(cat /tmp/riot-version.txt)"

          mkdir -p /tmp/champions

          echo "Downloading champion list..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/champion.json \
            "https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/en_US/champion.json"

          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          version = Path("/tmp/riot-version.txt").read_text(
              encoding="utf-8"
          ).strip()

          with open("/tmp/champion.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          champions = data.get("data", {})

          print(f"Champions found: {len(champions)}")

          for champion_id in champions:
              url = (
                  f"https://ddragon.leagueoflegends.com/"
                  f"cdn/{version}/data/en_US/champion/"
                  f"{champion_id}.json"
              )

              output = Path("/tmp/champions") / f"{champion_id}.json"

              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--retry",
                      "5",
                      "--retry-delay",
                      "2",
                      "-sS",
                      "-o",
                      str(output),
                      url
                  ],
                  check=True
              )

          print("All champion metadata downloaded.")
          PY

      # ==========================================
      # 8. BUILD COMPLETE SKIN INDEX
      # ==========================================

      - name: Build complete skin metadata index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          champion_dir = Path("/tmp/champions")

          index = {}

          total_skins = 0
          total_chromas = 0

          for file in sorted(champion_dir.glob("*.json")):

              try:
                  data = json.loads(
                      file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as e:
                  print(
                      f"WARNING: Could not read {file}: {e}"
                  )
                  continue

              champion_data = data.get(
                  "data",
                  {}
              )

              for champion_key, champion in champion_data.items():

                  champion_name = champion.get(
                      "name",
                      champion_key
                  )

                  champion_id = champion.get(
                      "key",
                      champion_key
                  )

                  skins = champion.get(
                      "skins",
                      []
                  )

                  for skin in skins:

                      skin_id = str(
                          skin.get("id", "")
                      ).strip()

                      if not skin_id:
                          continue

                      name = str(
                          skin.get(
                              "name",
                              ""
                          )
                      ).strip()

                      num = skin.get(
                          "num"
                      )

                      parent_skin = skin.get(
                          "parentSkin"
                      )

                      is_chroma = (
                          parent_skin is not None
                      )

                      # Riot splash art.
                      #
                      # Chromas normally do not have
                      # their own splash art, so use
                      # the parent skin's splash.
                      image_num = num

                      if is_chroma:
                          try:
                              parent_num = int(
                                  parent_skin
                              )

                              for possible_parent in skins:
                                  if (
                                      str(
                                          possible_parent.get(
                                              "num",
                                              ""
                                          )
                                      ) == str(
                                          parent_num
                                      )
                                  ):
                                      image_num = possible_parent.get(
                                          "num"
                                      )
                                      break

                          except Exception:
                              pass

                      image = (
                          f"https://ddragon.leagueoflegends.com/"
                          f"cdn/img/champion/splash/"
                          f"{champion_key}_{image_num}.jpg"
                      )

                      entry = {
                          "id": skin_id,
                          "skinNum": num,
                          "name": name,
                          "champion": champion_name,
                          "championId": champion_key,
                          "image": image
                      }

                      if is_chroma:
                          entry["parentSkin"] = str(
                              parent_skin
                          )

                      index[skin_id] = entry

                      total_skins += 1

                      if is_chroma:
                          total_chromas += 1

          output = Path(
              "/tmp/skin-index.json"
          )

          output.write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("RIOT SKIN INDEX")
          print("==========================================")
          print(f"Total indexed IDs: {len(index)}")
          print(f"Total skins:       {total_skins}")
          print(f"Total chromas:     {total_chromas}")
          print("==========================================")
          PY

      # ==========================================
      # 9. GENERATE skins.json FROM FANTOMES
      # ==========================================

      - name: Generate skins.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          fantome_dir = Path("fantome")
          index_file = Path("/tmp/skin-index.json")
          output_file = Path("data/skins.json")

          index = json.loads(
              index_file.read_text(
                  encoding="utf-8"
              )
          )

          fantome_files = sorted(
              [
                  p
                  for p in fantome_dir.iterdir()
                  if p.is_file()
                  and p.suffix.lower() == ".fantome"
              ],
              key=lambda p: int(
                  re.sub(
                      r"\D",
                      "",
                      p.stem
                  ) or 0
              )
          )

          matched = []
          not_found = []

          for file in fantome_files:

              skin_id = file.stem.strip()

              # Direct ID match
              skin = index.get(
                  skin_id
              )

              # If the filename contains
              # additional characters, try
              # extracting numeric ID.
              if skin is None:

                  match = re.search(
                      r"\d+",
                      skin_id
                  )

                  if match:
                      numeric_id = match.group(
                          0
                      )

                      skin = index.get(
                          numeric_id
                      )

                      if skin is not None:
                          skin_id = numeric_id

              if skin is None:

                  not_found.append(
                      skin_id
                  )

                  continue

              matched.append(
                  skin
              )

          # Remove duplicate IDs
          unique = {}

          for skin in matched:
              unique[
                  str(skin["id"])
              ] = skin

          matched = list(
              unique.values()
          )

          # Stable ordering
          matched.sort(
              key=lambda item: (
                  str(
                      item.get(
                          "champion",
                          ""
                      )
                  ).lower(),
                  int(
                      str(
                          item.get(
                              "id",
                              "0"
                          )
                      )
                      if str(
                          item.get(
                              "id",
                              "0"
                          )
                      ).isdigit()
                      else 0
                  )
              )
          )

          riot_version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          result = {
              "version": riot_version,
              "updatedAt": __import__(
                  "datetime"
              ).datetime.now(
                  __import__(
                      "datetime"
                  ).timezone.utc
              ).isoformat(),
              "skins": matched
          }

          output_file.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output_file.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("")
          print("==============================")
          print("SKIN SYNC RESULT")
          print("==============================")
          print(
              f"Fantome files: {len(fantome_files)}"
          )
          print(
              f"Matched skins: {len(matched)}"
          )
          print(
              f"Not found: {len(not_found)}"
          )
          print("==============================")

          if not_found:

              print("")
              print(
                  "First 100 not found IDs:"
              )

              for skin_id in not_found[:100]:
                  print(
                      f"  {skin_id}"
                  )

              if len(not_found) > 100:
                  print(
                      f"... and "
                      f"{len(not_found) - 100} more."
                  )

          print("")
          print(
              "skins.json generated successfully."
          )
          PY

      # ==========================================
      # 10. GENERATE FANTOME FILE LIST
      # ==========================================

      - name: Generate fantome-files.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path("fantome")

          files = sorted(
              p.name
              for p in folder.iterdir()
              if p.is_file()
              and p.suffix.lower() == ".fantome"
          )

          output = Path(
              "data/fantome-files.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Fantome files indexed: {len(files)}"
          )
          PY

      # ==========================================
      # 11. VERIFY DATA
      # ==========================================

      - name: Verify generated data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          skins_file = Path(
              "data/skins.json"
          )

          fantome_file = Path(
              "data/fantome-files.json"
          )

          skins = json.loads(
              skins_file.read_text(
                  encoding="utf-8"
              )
          )

          fantomes = json.loads(
              fantome_file.read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(
              skins.get("skins"),
              list
          )

          assert isinstance(
              fantomes,
              list
          )

          print(
              f"skins.json entries: "
              f"{len(skins['skins'])}"
          )

          print(
              f"fantome-files.json entries: "
              f"{len(fantomes)}"
          )

          print(
              "Generated JSON files are valid."
          )
          PY

      # ==========================================
      # 12. SHOW CHANGES
      # ==========================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- \
            fantome \
            data/skins.json \
            data/fantome-files.json
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ""
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "Changes detected."
          fi

      # ==========================================
      # 13. COMMIT
      # ==========================================

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fantome \
            data/skins.json \
            data/fantome-files.json

          git commit \
            -m "chore: sync League skins"

          git push