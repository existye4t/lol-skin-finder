name: Sync League Skins

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: league-skin-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. WEBSITE REPOSITORY
      # ==========================================

      - name: Checkout website repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==========================================
      # 2. LEAGUESKINS REPOSITORY
      # ==========================================

      - name: Checkout LeagueSkins repository
        uses: actions/checkout@v6
        with:
          repository: Alban1911/LeagueSkins
          path: source-skins
          fetch-depth: 1

      # ==========================================
      # 3. PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ==========================================
      # 4. PREPARE DIRECTORIES
      # ==========================================

      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p fantome
          mkdir -p data

          echo "Directories ready."

      # ==========================================
      # 5. SYNC FANTOME FILES
      # ==========================================

      - name: Sync Fantome files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCING FANTOME FILES"
          echo "=========================================="

          rm -rf fantome
          mkdir -p fantome

          count=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"

            cp -f "$file" "fantome/$filename"

            count=$((count + 1))
          done < <(
            find source-skins/skins \
              -type f \
              -iname "*.fantome" \
              -print0
          )

          echo ""
          echo "Fantome files copied: $count"

      # ==========================================
      # 6. DOWNLOAD RIOT VERSION
      # ==========================================

      - name: Download latest Riot Data Dragon version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DOWNLOADING RIOT DATA"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/versions.json \
            https://ddragon.leagueoflegends.com/api/versions.json

          VERSION=$(python3 - <<'PY'
          import json

          with open("/tmp/versions.json", "r", encoding="utf-8") as f:
              versions = json.load(f)

          print(versions[0])
          PY
          )

          echo "Riot Data Dragon version: $VERSION"

          echo "$VERSION" > /tmp/riot-version.txt

      # ==========================================
      # 7. DOWNLOAD RIOT CHAMPION METADATA
      # ==========================================

      - name: Download champion metadata
        shell: bash
        run: |
          set -e

          VERSION="$(cat /tmp/riot-version.txt)"

          mkdir -p /tmp/champions

          echo "Downloading champion list..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/champion.json \
            "https://ddragon.leagueoflegends.com/cdn/${VERSION}/data/en_US/champion.json"

          python3 <<'PY'
          import json
          import subprocess
          from pathlib import Path

          version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          with open(
              "/tmp/champion.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          champions = data.get(
              "data",
              {}
          )

          print(
              f"Champions found: {len(champions)}"
          )

          for champion_id in champions:

              url = (
                  "https://ddragon.leagueoflegends.com/"
                  f"cdn/{version}/data/en_US/champion/"
                  f"{champion_id}.json"
              )

              output = (
                  Path("/tmp/champions")
                  / f"{champion_id}.json"
              )

              subprocess.run(
                  [
                      "curl",
                      "-L",
                      "--fail",
                      "--retry",
                      "5",
                      "--retry-delay",
                      "2",
                      "-sS",
                      "-o",
                      str(output),
                      url
                  ],
                  check=True
              )

          print(
              "All champion metadata downloaded."
          )
          PY

      # ==========================================
      # 8. BUILD RIOT SKIN INDEX
      # ==========================================

      - name: Build Riot skin metadata index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          champion_dir = Path(
              "/tmp/champions"
          )

          index = {}

          total_skins = 0
          total_chromas = 0

          for file in sorted(
              champion_dir.glob("*.json")
          ):

              try:
                  data = json.loads(
                      file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as e:
                  print(
                      f"WARNING: Could not read {file}: {e}"
                  )
                  continue

              champion_data = data.get(
                  "data",
                  {}
              )

              for champion_key, champion in champion_data.items():

                  champion_name = str(
                      champion.get(
                          "name",
                          champion_key
                      )
                  ).strip()

                  champion_id = str(
                      champion.get(
                          "key",
                          champion_key
                      )
                  ).strip()

                  skins = champion.get(
                      "skins",
                      []
                  )

                  for skin in skins:

                      skin_id = str(
                          skin.get(
                              "id",
                              ""
                          )
                      ).strip()

                      if not skin_id:
                          continue

                      name = str(
                          skin.get(
                              "name",
                              ""
                          )
                      ).strip()

                      num = skin.get(
                          "num"
                      )

                      parent_skin = skin.get(
                          "parentSkin"
                      )

                      is_chroma = (
                          parent_skin is not None
                      )

                      image_num = num

                      if is_chroma:

                          try:
                              parent_num = int(
                                  parent_skin
                              )

                              for possible_parent in skins:

                                  if str(
                                      possible_parent.get(
                                          "num",
                                          ""
                                      )
                                  ) == str(
                                      parent_num
                                  ):
                                      image_num = (
                                          possible_parent.get(
                                              "num"
                                          )
                                      )
                                      break

                          except Exception:
                              pass

                      image = (
                          "https://ddragon.leagueoflegends.com/"
                          "cdn/img/champion/splash/"
                          f"{champion_key}_{image_num}.jpg"
                      )

                      entry = {
                          "id": skin_id,
                          "skinNum": num,
                          "name": name,
                          "champion": champion_name,
                          "championId": champion_id,
                          "image": image
                      }

                      if is_chroma:
                          entry["parentSkin"] = str(
                              parent_skin
                          )

                      index[skin_id] = entry

                      total_skins += 1

                      if is_chroma:
                          total_chromas += 1

          Path(
              "/tmp/riot-skin-index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("RIOT SKIN INDEX")
          print("==========================================")
          print(
              f"Indexed IDs:      {len(index)}"
          )
          print(
              f"Total skins:      {total_skins}"
          )
          print(
              f"Total chromas:    {total_chromas}"
          )
          print("==========================================")
          PY

      # ==========================================
      # 9. DOWNLOAD COMMUNITYDRAGON SKINS
      # ==========================================

      - name: Download CommunityDragon skin metadata
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMMUNITYDRAGON"
          echo "=========================================="

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/cdragon-skins.json \
            "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/skins.json"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -sS \
            -o /tmp/cdragon-championskins.json \
            "https://raw.communitydragon.org/latest/game/global/champions/championskins.info.json"

          echo "CommunityDragon skins downloaded."

      # ==========================================
      # 10. NORMALIZE COMMUNITYDRAGON DATA
      # ==========================================

      - name: Build CommunityDragon fallback index
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          def load_json(path):
              try:
                  return json.loads(
                      Path(path).read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as e:
                  print(
                      f"WARNING: Could not load {path}: {e}"
                  )
                  return None

          def add_entry(index, entry):

              if not isinstance(entry, dict):
                  return

              possible_ids = [
                  entry.get("id"),
                  entry.get("skinId"),
                  entry.get("contentId"),
                  entry.get("catalogEntryId"),
                  entry.get("itemId")
              ]

              skin_id = None

              for value in possible_ids:

                  if value is None:
                      continue

                  value = str(value).strip()

                  if value.isdigit():
                      skin_id = value
                      break

              if not skin_id:
                  return

              champion_name = (
                  entry.get("championName")
                  or entry.get("champion")
                  or entry.get("characterName")
                  or entry.get("character")
                  or ""
              )

              champion_id = (
                  entry.get("championId")
                  or entry.get("characterId")
                  or ""
              )

              name = (
                  entry.get("name")
                  or entry.get("displayName")
                  or entry.get("skinName")
                  or ""
              )

              image = (
                  entry.get("image")
                  or entry.get("splash")
                  or entry.get("splashPath")
                  or entry.get("loadScreenPath")
                  or ""
              )

              result = {
                  "id": skin_id,
                  "name": str(name).strip(),
                  "champion": str(
                      champion_name
                  ).strip(),
                  "championId": str(
                      champion_id
                  ).strip(),
                  "image": str(
                      image
                  ).strip()
              }

              if skin_id not in index:
                  index[skin_id] = result

          index = {}

          data = load_json(
              "/tmp/cdragon-skins.json"
          )

          def walk(value):

              if isinstance(value, dict):

                  # Try this object itself.
                  add_entry(
                      index,
                      value
                  )

                  for child in value.values():
                      walk(child)

              elif isinstance(value, list):

                  for child in value:
                      walk(child)

          if data is not None:
              walk(data)

          before = len(index)

          data2 = load_json(
              "/tmp/cdragon-championskins.json"
          )

          if data2 is not None:
              walk(data2)

          after = len(index)

          Path(
              "/tmp/cdragon-skin-index.json"
          ).write_text(
              json.dumps(
                  index,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print("COMMUNITYDRAGON INDEX")
          print("==========================================")
          print(
              f"From skins.json:              {before}"
          )
          print(
              f"After championskins fallback: {after}"
          )
          print("==========================================")
          PY

      # ==========================================
      # 11. GENERATE skins.json
      # ==========================================

      - name: Generate skins.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          fantome_dir = Path(
              "fantome"
          )

          riot_index = json.loads(
              Path(
                  "/tmp/riot-skin-index.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          cdragon_index = json.loads(
              Path(
                  "/tmp/cdragon-skin-index.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          fantome_files = sorted(
              [
                  p
                  for p in fantome_dir.iterdir()
                  if p.is_file()
                  and p.suffix.lower() == ".fantome"
              ],
              key=lambda p: (
                  int(
                      re.sub(
                          r"\D",
                          "",
                          p.stem
                      ) or 0
                  ),
                  p.name
              )
          )

          matched = {}
          riot_matched = 0
          cdragon_matched = 0
          not_found = []

          def normalize_id(value):

              value = str(
                  value
              ).strip()

              if value.isdigit():
                  return str(
                      int(value)
                  )

              match = re.search(
                  r"\d+",
                  value
              )

              if match:
                  return str(
                      int(
                          match.group(
                              0
                          )
                      )
                  )

              return None

          for file in fantome_files:

              original_id = file.stem.strip()

              skin_id = normalize_id(
                  original_id
              )

              if not skin_id:
                  not_found.append(
                      original_id
                  )
                  continue

              skin = riot_index.get(
                  skin_id
              )

              source = "Riot"

              if skin is not None:
                  riot_matched += 1

              else:
                  skin = cdragon_index.get(
                      skin_id
                  )

                  source = "CommunityDragon"

                  if skin is not None:
                      cdragon_matched += 1

              if skin is None:
                  not_found.append(
                      original_id
                  )
                  continue

              skin = dict(
                  skin
              )

              skin["id"] = skin_id

              # ----------------------------------
              # Cleanup
              # ----------------------------------

              skin["name"] = str(
                  skin.get(
                      "name",
                      ""
                  )
              ).strip()

              skin["champion"] = str(
                  skin.get(
                      "champion",
                      ""
                  )
              ).strip()

              skin["championId"] = str(
                  skin.get(
                      "championId",
                      ""
                  )
              ).strip()

              skin["image"] = str(
                  skin.get(
                      "image",
                      ""
                  )
              ).strip()

              # ----------------------------------
              # If CommunityDragon image is an
              # internal asset path, use Riot
              # splash as a safe fallback.
              # ----------------------------------

              image = skin.get(
                  "image",
                  ""
              )

              if (
                  image
                  and not image.startswith(
                      "http://"
                  )
                  and not image.startswith(
                      "https://"
                  )
              ):
                  champion_id = skin.get(
                      "championId",
                      ""
                  )

                  skin_num = skin.get(
                      "skinNum"
                  )

                  if (
                      champion_id
                      and skin_num is not None
                  ):
                      skin["image"] = (
                          "https://ddragon.leagueoflegends.com/"
                          "cdn/img/champion/splash/"
                          f"{champion_id}_{skin_num}.jpg"
                      )

              skin["_metadataSource"] = source

              matched[skin_id] = skin

          skins = list(
              matched.values()
          )

          # --------------------------------------
          # Stable ordering
          # --------------------------------------

          def sort_key(item):

              champion = str(
                  item.get(
                      "champion",
                      ""
                  )
              ).lower()

              try:
                  numeric_id = int(
                      str(
                          item.get(
                              "id",
                              "0"
                          )
                      )
                  )
              except Exception:
                  numeric_id = 0

              return (
                  champion,
                  numeric_id
              )

          skins.sort(
              key=sort_key
          )

          # Remove internal source field before
          # writing public JSON.
          for skin in skins:
              skin.pop(
                  "_metadataSource",
                  None
              )

          riot_version = Path(
              "/tmp/riot-version.txt"
          ).read_text(
              encoding="utf-8"
          ).strip()

          result = {
              "version": riot_version,
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "skins": skins
          }

          output = Path(
              "data/skins.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("")
          print("==============================")
          print("SKIN SYNC RESULT")
          print("==============================")
          print(
              f"Fantome files:       {len(fantome_files)}"
          )
          print(
              f"Riot matched:        {riot_matched}"
          )
          print(
              f"CommunityDragon:     {cdragon_matched}"
          )
          print(
              f"Total matched:       {len(skins)}"
          )
          print(
              f"Not found:           {len(not_found)}"
          )
          print("==============================")

          if not_found:

              print("")
              print(
                  "Not found IDs:"
              )

              for skin_id in not_found[:100]:
                  print(
                      f"  {skin_id}"
                  )

              if len(not_found) > 100:
                  print(
                      f"... and {len(not_found) - 100} more."
                  )

          print("")
          print(
              "skins.json generated successfully."
          )
          PY

      # ==========================================
      # 12. GENERATE FANTOME FILE LIST
      # ==========================================

      - name: Generate fantome-files.json
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          folder = Path(
              "fantome"
          )

          files = sorted(
              p.name
              for p in folder.iterdir()
              if p.is_file()
              and p.suffix.lower() == ".fantome"
          )

          output = Path(
              "data/fantome-files.json"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          output.write_text(
              json.dumps(
                  files,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Fantome files indexed: {len(files)}"
          )
          PY

      # ==========================================
      # 13. VERIFY GENERATED DATA
      # ==========================================

      - name: Verify generated data
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import json
          from pathlib import Path

          skins_file = Path(
              "data/skins.json"
          )

          fantome_file = Path(
              "data/fantome-files.json"
          )

          skins = json.loads(
              skins_file.read_text(
                  encoding="utf-8"
              )
          )

          fantomes = json.loads(
              fantome_file.read_text(
                  encoding="utf-8"
              )
          )

          assert isinstance(
              skins.get("skins"),
              list
          )

          assert isinstance(
              fantomes,
              list
          )

          skin_ids = {
              str(
                  skin.get(
                      "id"
                  )
              )
              for skin in skins["skins"]
          }

          fantome_ids = {
              Path(
                  name
              ).stem
              for name in fantomes
          }

          print(
              f"skins.json entries: "
              f"{len(skins['skins'])}"
          )

          print(
              f"fantome-files.json entries: "
              f"{len(fantomes)}"
          )

          print(
              f"Unique skin IDs: "
              f"{len(skin_ids)}"
          )

          print(
              "Generated JSON files are valid."
          )
          PY

      # ==========================================
      # 14. CHECK CHANGES
      # ==========================================

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git status --short

          if git diff --quiet -- \
            fantome \
            data/skins.json \
            data/fantome-files.json
          then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "No changes detected."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Changes detected."

          fi

      # ==========================================
      # 15. COMMIT AND PUSH
      # ==========================================

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            fantome \
            data/skins.json \
            data/fantome-files.json

          git commit \
            -m "chore: sync League skins"

          git push