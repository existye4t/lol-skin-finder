name: Kaynak Repodan Skin Senkronizasyonu

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Doğrula ve derle, yayınlama'
        type: boolean
        default: false
      force_deploy:
        description: 'Veri değişmediyse de Pages dağıtımını yenile'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-skins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Kataloğu oluştur ve doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.catalog.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:sync

      - name: Kataloğu karşılaştır
        id: catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npm run sync-data -- --report="$RUNNER_TEMP/catalog-report.json"
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/catalog-report.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + Boolean(r.changed.length) + '\n');
          const lines = [
            '## Skin senkronizasyonu',
            '',
            '- Upstream: `' + r.revision + '`',
            '- Patch: `' + r.patch + '`',
            '- Manifest girdileri: +' + r.addedCount + ', değişen ' + r.changedCount + ', kaldırılan bağlantı ' + r.removedCount,
            '- Live’a geçen PBE kayıtları: ' + r.promoted.length,
            '- Belirsiz eşleşmeler: ' + r.ambiguities.length,
            '- Paket boyutu uyuşmazlıkları: ' + r.indexConflicts,
            '- İndekste bulunmayan dosyalar: ' + r.unindexed.length,
            '- Değişen çıktılar: ' + (r.changed.join(', ') || 'yok')
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Üretim derlemesini doğrula
        if: steps.catalog.outputs.changed == 'true' || inputs.dry_run
        run: npm run build

      - name: Katalog çıktılarını sakla
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-skin-catalog
          if-no-files-found: error
          retention-days: 3
          path: |
            public/data/fantome-manifest.json
            public/data/skins.json
            public/data/rainbow.json
            public/data/classic.json

      - name: Senkronizasyon raporunu sakla
        uses: actions/upload-artifact@v7.0.2
        with:
          name: skin-sync-report
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/catalog-report.json

  publish:
    name: Doğrulanmış kataloğu commit et
    needs: sync
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-skin-catalog
          path: ${{ runner.temp }}/verified-skin-catalog
      - name: Katalog commit'ini gönder
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in fantome-manifest.json skins.json rainbow.json classic.json; do
            src="$RUNNER_TEMP/verified-skin-catalog/$file"
            test -f "$src" && test ! -L "$src"
            cp -- "$src" "public/data/$file"
            git add -- "public/data/$file"
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi
          git commit -m 'chore(data): synchronize the skin catalog'
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: GitHub Pages yayınla
    needs: [sync, publish]
    if: >-
      always() && github.ref == 'refs/heads/main' && !inputs.dry_run &&
      needs.sync.result == 'success' &&
      (needs.publish.result == 'success' && needs.publish.outputs.commit != '' ||
       needs.publish.result == 'skipped' && needs.sync.outputs.changed == 'false' && inputs.force_deploy)
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.publish.outputs.commit || github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
